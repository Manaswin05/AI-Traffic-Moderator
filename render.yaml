services:
  - type: web
    name: ai-traffic-control
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      npm install
      npm run build
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.18.0
      - key: VIDEO_SOURCE
        value: demo_traffic.mp4
    healthCheckPath: /traffic_status
    autoDeploy: true
